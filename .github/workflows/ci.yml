name: CI

# Pull requests only. Pushes to main are covered by the deploy workflow, which
# runs the same checks and gates the release on them — running both would just
# duplicate the work.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production app
        run: npm run build
